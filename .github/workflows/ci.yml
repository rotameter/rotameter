name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"

jobs:
  ci:
    name: Workspace Lint, Test & Purity Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.100 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          components: rustfmt, clippy

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (default & arrow features)
        run: cargo clippy --workspace --exclude rotameter-store-duckdb --all-targets -- -D warnings && cargo clippy -p rotameter-arrow -p rotameter-cli --features arrow --all-targets -- -D warnings

      - name: Run workspace unit tests (excluding opt-in duckdb)
        run: cargo nextest run --workspace --exclude rotameter-store-duckdb --features rotameter-cli/arrow

      - name: Run workspace doc tests
        run: cargo test --doc --workspace --exclude rotameter-store-duckdb

      - name: Verify default rotameter-cli stays free of arrow/parquet/duckdb
        run: '! cargo tree -p rotameter-cli | grep -E "arrow|parquet|duckdb"'

      - name: Check rotameter-cli feature matrix
        run: |
          cargo check -p rotameter-cli --no-default-features
          cargo check -p rotameter-cli --no-default-features --features server,sqlite
          cargo check -p rotameter-cli --no-default-features --features mcp,tui
          cargo check -p rotameter-cli --no-default-features --features sqlite,arrow

      - name: Verify rotameter-core purity and unsafe forbids
        run: ./scripts/check-core-purity.sh

      - name: Enforce collect.js gzip size and privacy invariants
        run: ./scripts/check-collector-size.sh

      - name: Enforce 250-line ceiling on Rust source files
        run: |
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -ge 250 ]; then
              echo "ERROR: ${file} has ${lines} lines (limit < 250)" >&2
              exit 1
            fi
          done < <(find crates -name '*.rs' -print0)

      - name: Show sccache statistics
        run: sccache --show-stats

  astro-cloudflare:
    name: Build, Typecheck & Test @rotameter/astro-cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Typecheck, build, test & pack dry-run
        working-directory: integrations/astro-cloudflare
        run: |
          npm run typecheck
          npm run build
          npm test
          npm pack --dry-run

  duckdb:
    name: Opt-in DuckDB OLAP Backend & Parity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.100 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          components: clippy

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Clippy & test rotameter-store-duckdb + rotameter-cli --features duckdb
        run: |
          cargo clippy -p rotameter-store-duckdb -p rotameter-cli --features duckdb --all-targets -- -D warnings
          cargo nextest run -p rotameter-store-duckdb
          cargo nextest run -p rotameter-cli --features duckdb
