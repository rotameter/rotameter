name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: aarch64-apple-darwin
            os: macos-15
            musl: false
          - target: x86_64-apple-darwin
            os: macos-15
            musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.100 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          targets: ${{ matrix.target }}

      - name: Install musl build tooling
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p rotameter-cli --bin rotameter

      - name: Package release archive
        shell: bash
        run: |
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/rotameter"
          if command -v strip >/dev/null 2>&1; then
            strip "$bin" || true
          fi
          archive="dist/rotameter-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" rotameter

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotameter-${{ matrix.target }}
          path: dist/*.tar.gz

  build-duckdb-linux:
    name: Build (x86_64-unknown-linux-gnu-duckdb)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.100 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"

      - name: Install native C++ build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ pkg-config

      - name: Build DuckDB release binary
        run: |
          cargo build --release --locked \
            -p rotameter-cli \
            --bin rotameter \
            --no-default-features \
            --features server,sqlite,duckdb

      - name: Package DuckDB release archive
        shell: bash
        run: |
          mkdir -p dist staging
          bin="target/release/rotameter"
          if command -v strip >/dev/null 2>&1; then
            strip "$bin" || true
          fi
          cp "$bin" THIRD_PARTY_NOTICES staging/
          archive="dist/rotameter-${{ github.ref_name }}-x86_64-unknown-linux-gnu-duckdb.tar.gz"
          tar -C staging -czf "$archive" rotameter THIRD_PARTY_NOTICES

      - name: Upload DuckDB target artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotameter-x86_64-unknown-linux-gnu-duckdb
          path: dist/*.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-binaries, build-duckdb-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt

  publish-oci:
    name: Build & Push Multi-Arch OCI Image
    needs: build-binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-npm:
    name: Publish @rotameter/astro-cloudflare to npm
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          pkg_ver="$(node -p "require('./integrations/astro-cloudflare/package.json').version")"
          if [ "$tag_ver" != "$pkg_ver" ]; then
            echo "ERROR: tag version ($tag_ver) != @rotameter/astro-cloudflare version ($pkg_ver)" >&2
            exit 1
          fi

      - name: Build, typecheck, and test package
        working-directory: integrations/astro-cloudflare
        run: |
          npm run typecheck
          npm run build
          npm test
          node -e "Promise.all([import('./dist/index.js'), import('./dist/astro.js'), import('./dist/beacon.js')]).then(([idx, astro, beacon]) => { if (!idx.handleEventProxy || !idx.trackServerHit || !astro.createEventProxyRoute || !beacon.initRotameterBeacon) process.exit(1); }).catch((err) => { console.error(err); process.exit(1); })"

      - name: Publish @rotameter/astro-cloudflare to npm
        working-directory: integrations/astro-cloudflare
        shell: bash
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          if [[ "$tag_ver" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
