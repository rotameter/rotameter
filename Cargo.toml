[workspace]
resolver = "3"
members = [
    "crates/rotameter-core",
    "crates/rotameter-arrow",
    "crates/rotameter-store-duckdb",
    "crates/rotameter-store-sqlite",
    "crates/rotameter-server",
    "crates/rotameter-client",
    "crates/rotameter-mcp",
    "crates/rotameter-tui",
    "crates/rotameter-cli",
]
exclude = [
    "reserve-staging",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.100"
authors = ["Colin Wolff"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rotameter/rotameter"

[workspace.dependencies]
aho-corasick = "1.1"
arrow-array = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
duckdb = { version = "1.20001", features = ["bundled", "appender-arrow"] }
getrandom = { version = "0.4" }
hmac-sha256 = "1.1"
http-body-util = "0.1"
maxminddb = "0.33"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "1.2"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
url = "2.5"
zstd = "0.14"
rotameter-core = { path = "crates/rotameter-core", version = "0.1.1" }
rotameter-arrow = { path = "crates/rotameter-arrow", version = "0.1.1" }
rotameter-store-duckdb = { path = "crates/rotameter-store-duckdb", version = "0.1.1" }
rotameter-store-sqlite = { path = "crates/rotameter-store-sqlite", version = "0.1.1" }
rotameter-server = { path = "crates/rotameter-server", version = "0.1.1" }
rotameter-client = { path = "crates/rotameter-client", version = "0.1.1" }
rotameter-mcp = { path = "crates/rotameter-mcp", version = "0.1.1" }
rotameter-tui = { path = "crates/rotameter-tui", version = "0.1.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
opt-level = 0
debug = 1 # Line tables only: keeps panic file:line backtraces, cuts binary/target size ~70%

[profile.test]
opt-level = 0
debug = 1

[profile.dev.package."*"]
debug = 0 # Omit DWARF from third-party crates (duckdb/arrow/parquet)

[profile.test.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
