[workspace]
resolver = "3"
members = [
    "crates/rotameter-core",
    "crates/rotameter-store-sqlite",
    "crates/rotameter-server",
    "crates/rotameter-client",
    "crates/rotameter-mcp",
    "crates/rotameter-tui",
    "crates/rotameter-cli",
]
exclude = [
    "reserve-staging",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.99"
authors = ["Colin Wolff"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/colinwolff/rotameter"
homepage = "https://github.com/colinwolff/rotameter"

[workspace.dependencies]
aho-corasick = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
rotameter-core = { path = "crates/rotameter-core", version = "0.1.0-alpha.1" }
rotameter-store-sqlite = { path = "crates/rotameter-store-sqlite", version = "0.1.0-alpha.1" }
rotameter-server = { path = "crates/rotameter-server", version = "0.1.0-alpha.1" }
rotameter-client = { path = "crates/rotameter-client", version = "0.1.0-alpha.1" }
rotameter-mcp = { path = "crates/rotameter-mcp", version = "0.1.0-alpha.1" }
rotameter-tui = { path = "crates/rotameter-tui", version = "0.1.0-alpha.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
